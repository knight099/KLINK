name: Launch checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: klink
          POSTGRES_PASSWORD: klink_test_only
          POSTGRES_DB: klink_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U klink -d klink_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://klink:klink_test_only@localhost:5432/klink_test
      JWT_SECRET: ci-only-signing-secret-with-at-least-32-characters
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm build
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm audit --audit-level=high
